<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lịch Sử Giao Dịch – Cư Dân</title>
<style>
/* Base CSS from other files */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1B4F72;--primary-light:#2E86C1;--primary-pale:#D6EAF8;
  --accent:#F39C12;--success:#1E8449;--success-bg:#D5F5E3;
  --danger:#C0392B;--danger-bg:#FADBD8;
  --bg:#EEF2F7;--surface:#fff;--text:#1A252F;--muted:#5D6D7E;
  --border:#D5DBDB;--radius:10px;
}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.hdr{background:var(--primary);padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;position:fixed;top:0;left:0;right:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-icon{width:34px;height:34px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.hdr-title{font-size:13px;font-weight:700;color:#fff}
.hdr-sub{font-size:10px;color:rgba(255,255,255,.5)}
.hdr-right{display:flex;align-items:center;gap:8px}
.user-info{text-align:right}
.user-info .name{font-size:12.5px;font-weight:600;color:#fff}
.user-info .room{font-size:10px;color:rgba(255,255,255,.6)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.btn-logout{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;font-family:inherit}

.nav-tabs{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;gap:0;margin-top:56px;position:sticky;top:56px;z-index:90}
.tab{padding:14px 20px;font-size:13.5px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:all .15s;text-decoration:none;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--primary)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}

.content{padding:24px 20px;max-width:900px;margin:0 auto}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.card-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-ttl{font-size:14px;font-weight:700;color:var(--text)}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:#F5F8FA;padding:12px 14px;text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border)}
tbody td{padding:14px 14px;border-bottom:1px solid #F0F4F8;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#F8FAFC}

.badge{display:inline-block;padding:4px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge-success{background:var(--success-bg);color:var(--success)}

footer{background:#fff;border-top:1px solid var(--border);padding:12px 20px;text-align:center;font-size:11.5px;color:var(--muted);margin-top:20px}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">
    <div class="hdr-icon">🏢</div>
    <div><div class="hdr-title">BlueMoon</div><div class="hdr-sub">Cổng thông tin cư dân</div></div>
  </div>
  <div class="hdr-right">
    <div class="user-info">
      <div class="name" id="hdr-name">—</div>
      <div class="room" id="hdr-room">—</div>
    </div>
    <div class="avatar" id="hdr-avatar">U</div>
    <button class="btn-logout" onclick="AUTH.logout()">🚪 Đăng xuất</button>
  </div>
</header>

<nav class="nav-tabs">
  <a href="cu-dan-nha-toi.html" class="tab ">🏠 Nhà của tôi</a>
  <a href="cu-dan-hoa-don.html" class="tab ">🧾 Hóa đơn</a>
  <a href="cu-dan-thanh-toan.html" class="tab ">💳 Thanh toán</a>
  <a href="cu-dan-lich-su.html" class="tab active">📜 Lịch sử</a>
</nav>

<div class="content">
  <div class="card">
    <div class="card-hdr"><div class="card-ttl">📜 Lịch sử giao dịch (Đã xác nhận)</div></div>
    <table>
      <thead><tr><th>Mã HĐ</th><th>Nội dung</th><th>Ngày xác nhận</th><th>Số tiền</th><th>Trạng thái</th></tr></thead>
      <tbody id="historyBody">
        <tr><td colspan="5" style="text-align: center; padding: 20px; color: var(--muted)">Đang tải dữ liệu...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer><p>© 2026 <b>BlueMoon</b> – Cổng thông tin cư dân – Nhóm 13</p></footer>

<script src="auth.js"></script>
<script>
AUTH.init('cudanlichsu');

const API = 'http://localhost:8080/api';
const token = AUTH.token;
const user  = AUTH.user;

document.getElementById('hdr-name').textContent   = user.hoTen || user.username || '—';
document.getElementById('hdr-avatar').textContent = (user.hoTen || user.username || 'U')[0].toUpperCase();
document.getElementById('hdr-room').textContent    = `Căn hộ ${user.canHo || '—'}`;

async function loadData() {
  try {
    const res = await fetch(`${API}/me/hoa-don`, {
      headers: {'Authorization': `Bearer ${token}`}
    });
    if (res.ok) {
      const data = await res.json();
      
      let allPaidFees = [];
      data.forEach(hd => {
         const paidFees = (hd.chiTietList || []).filter(c => c.trangThai === 'da_dong');
         paidFees.forEach(pf => {
            allPaidFees.push({
               ...pf,
               thangHoaDon: hd.thang,
               maHoaDon: hd.id
            });
         });
      });
      
      const tbody = document.getElementById('historyBody');
      if (allPaidFees.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--muted)">Chưa có giao dịch nào được ghi nhận.</td></tr>';
      } else {
        // Sort newest first
        allPaidFees.sort((a,b) => b.id - a.id);
        
        tbody.innerHTML = allPaidFees.map(pf => {
          let dateStr = '—';
          if (pf.updatedAt) {
            const d = new Date(pf.updatedAt);
            dateStr = d.toLocaleDateString('vi-VN') + ' ' + d.toLocaleTimeString('vi-VN', {hour:'2-digit', minute:'2-digit'});
          }
          const tenPhi = pf.danhMucPhi ? pf.danhMucPhi.tenPhi : (pf.tenPhi || 'Khoản phí');

          return `
          <tr>
            <td><b style="color:var(--text)">#HD-${pf.maHoaDon}</b></td>
            <td>Thanh toán: ${tenPhi} (Tháng ${pf.thangHoaDon.split('-').reverse().join('/')})</td>
            <td style="color:var(--muted)">${dateStr}</td>
            <td><b style="color:var(--success)">+${pf.thanhTien.toLocaleString('vi-VN')}đ</b></td>
            <td><span class="badge badge-success">✅ Thành công</span></td>
          </tr>
        `}).join('');
      }
    }
  } catch(e) {
    console.error(e);
    document.getElementById('historyBody').innerHTML = '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--danger)">Lỗi kết nối máy chủ!</td></tr>';
  }
}

loadData();
</script>
</body>
</html>
